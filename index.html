else if(a==='reset'){const f=fresh().G;Object.assign(st.G,f);P()}
else if(a==='enh'){if(spend(5)){Object.assign(st.G,{b:105,c:112,s:118,w:6,v:40});P();toast('Auto enhance applied')}}
else if(a==='mbon'){st.mb.on^=1;P()}else if(a==='mbad'){if(!st.mb.ad&&!spend(5))return;st.mb.ad^=1;if(st.mb.ad)st.mb.on=1;P()}else if(a==='mbm'){st.mb.mode=k;P()}
else if(a==='tr'){if(items[sel])items[sel].tr=+k;else{st.tr=+k;items.forEach(c=>delete c.tr)}P()}
else if(a==='music')$('#mfile').click();else if(a==='rmmus'){st.mus=null;aud.pause();drawTL();P()}
else if(a==='autoedit')autoEdit();else if(a==='mood'){if(spend(5)){applyMood(MOODS[+k]);P();toast(MOODS[+k].n.slice(2)+' mood applied')}}else if(a==='ai'){const t=$('#pr').value.trim();if(t&&spend(10)){const r=aiGen(t);P();$('#pr').value=t;$('#ah').textContent=r.length?'Applied: '+r.join(', '):'No keywords found. Try a color, a mood or an effect name.'}}
else if(a==='savetpl'){const n=$('#tn').value.trim();if(!n)return toast('Enter a name');myTpl.push({n,o:SAVE()});LS('mt',myTpl);toast('Template saved')}
else if(a==='saveproj'){saveF(new Blob([JSON.stringify({omnia:1,name:$('#tn').value.trim()||'Project',o:SAVE()})],{type:'application/json'}),'project.json')}
else if(a==='plans')plans();else if(a==='acct')acct();else if(a==='close')$('#modal').className='';
else if(a==='buy'){const t=+b.dataset.t;plan={t,exp:Date.now()+ +b.dataset.d*864e5};LS('p',plan);credits+=t===2?300:150;LS('c',credits);hdr();$('#modal').className='';toast(PR[t].n+' activated (demo)')}
else if(a==='signup'){const n=$('#sn').value.trim(),m=$('#se').value.trim();if(!n||!/\S+@\S+\.\S+/.test(m))return toast('Enter your name and a valid email');user={name:n,email:m};LS('u',user);hdr();$('#modal').className=''}
else if(a==='logout'){user=null;LS('u',null);hdr();$('#modal').className=''}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.className=''});
document.addEventListener('input',e=>{const t=e.target,v=(t.type==='color'||t.type==='text')?t.value:+t.value,n=t.nextElementSibling;if(n&&n.tagName==='B'&&t.type==='range')n.textContent=v;
if(t.dataset.g)st.G[t.dataset.g]=v;else if(t.dataset.b)st.bt[t.dataset.b]=v;else if(t.dataset.m)st.mb[t.dataset.m]=v;else if(t.dataset.v){st.vol=v;aud.volume=v/100}
else if(t.dataset.kf){const c=items[sel],q=seq(),j=q.L.indexOf(c);if(c&&j>=0){const loc=+Math.max(0,ph-q.ss[j]).toFixed(2);if(c.kf&&c.kf.length){let z=c.kf.find(z=>Math.abs(z.t-loc)<.08);if(!z){z={...kfv(c,loc),t:loc};c.kf.push(z);c.kf.sort((x,y)=>x.t-y.t)}z[t.dataset.kf]=v}else{c.kb=c.kb||{...DK};c.kb[t.dataset.kf]=v}}}else if(t.dataset.t){const l=st.tx[tsel];if(l){const k=t.dataset.t;l[k]=k==='y'?v/100:v;ph=l.st;playing=0;drawTL()}}
else if(t.dataset.d){const c=items[sel];if(c){c.d=v;drawTL()}}
else if(t.id==='sc'){const q=seq();ph=+t.value/1000*q.tot;playing=0;aud.pause()}});
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('#mfile').onchange=e=>{const f=e.target.files[0];if(f){aud.src=URL.createObjectURL(f);aud.volume=st.vol/100;st.mus={name:f.name};drawTL();P()}e.target.value=''};
$('#jfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(!j.o||!j.o.fi&&j.o.fi!==0)throw 0;
if(jmode==='proj'){st=fresh();items=[];sel=-1;ph=0;playing=0;applyT(j.o);openEd();toast('Project loaded. Add your media to continue.')}else{myTpl.push({n:j.name||f.name.replace(/\.json$/,''),o:j.o});LS('mt',myTpl);toast('Template added. Find it in Templates.')}}catch(x){toast('That file is not an OmniaCut project or template')}};
document.addEventListener('pointerdown',e=>{if(e.target.type==='range'&&e.target.id!=='sc')snap()});
let drag=0;function mv2(e){const r=cv.getBoundingClientRect(),l=st.tx[tsel];l.x=Math.max(.05,Math.min(.95,(e.clientX-r.left)/r.width));l.y=Math.max(.04,Math.min(.96,(e.clientY-r.top)/r.height));ph=Math.max(l.st,Math.min(ph,l.st+l.du-.05))}
cv.addEventListener('pointerdown',e=>{if(tab==='text'&&po&&st.tx[tsel]){snap();drag=1;playing=0;cv.setPointerCapture(e.pointerId);mv2(e)}});cv.addEventListener('pointermove',e=>{if(drag)mv2(e)});cv.addEventListener('pointerup',()=>{drag=0});
hdr();size();requestAnimationFrame(loop);
</script>
</body>
