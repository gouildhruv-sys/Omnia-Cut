<style>

</main>
<div id="busy"><div class="box"><h2 id="bt">Working…</h2><p class="mu" id="bs"></p><div id="pbar" class="ind"><i></i></div><button class="btn o" data-a="stop" id="stopb">Stop</button></div></div>
<div id="res"><div class="box"><h2>Your video is ready</h2><video id="rv" controls playsinline></video><div class="row"><button class="btn" id="dlb">Download</button><button class="btn o" data-a="closeres">Close</button></div></div></div>

<input id="mfile" type="file" accept="audio/*" hidden><input id="afile" type="file" accept="image/*" multiple hidden>

look:{filter:M.f,exposure:al<90?112:al>170?92:100,contrast:V==='cine'||V==='viral'?112:105,saturation:as_<40?122:as_>110?96:108,warmth:aw>25?-6:aw<-25?6:2,vignette:V==='cine'?45:30,grain:V==='retro'?30:0,blur:MODEL==='ultra'?{on:1,mode:'zoom',strength:30,adaptive:1}:M.blur},effects:fxl,beauty:{},reactive:MD.rc,groove:G,progress_bar:MD.pb||0,events,sfx,clips,texts,stickers,music_volume:85}}
/* ---------- the Claude Director (sees the footage) ---------- */
function info(){return{ratio:st.ratio,clips:lib.map((s,i)=>({clip:i,type:s.v?'video':'photo',seconds:s.v?+s.m.dur.toFixed(1):null,size:s.m.w+'x'+s.m.h,brightness:Math.round(s.al),saturation:Math.round(s.as),warmth:Math.round(s.aw),motion:+s.am.toFixed(1),filmstrip_frame_times:s.stripT||null,scene_changes_at:s.cuts||[],best_moments:s.v?moments(s,2,3).map(m=>({start:+m.t.toFixed(1),score:+m.sc.toFixed(1)})):[]})),meme_stickers:assets.map((a,i)=>({asset:i,file:a.name})),music:music?{bpm:music.bpm,seconds:+music.dur.toFixed(1),beat_times:music.beats.slice(0,160).map(b=>+b.toFixed(2)),bass_hits_time_strength:music.kicks.slice(0,200).map((t,i)=>[+t.toFixed(2),music.kstr[i]]),drops_at:music.drops,energy_0_to_9_per_second:music.eps.slice(0,120)}:null}}
async function llmPlan(req,prev){let lim={};try{lim=await SAMPLE.limits()||{}}catch(e){}
const mc=lim.images?Math.min(lim.images.maxCount||8,12):0,imgs=lib.slice(0,mc).map(s=>s.thumb).filter(Boolean),M=MODELS[MODEL];
const P=`You are an award-winning short-form video editor, motion designer and colorist. Build a COMPLETE edit plan for the user's footage so the result feels hand-made by a top editor: a strong hook, deliberate pacing, motivated cuts, beat-synced motion graphics, clean camera motion, one consistent color look and a satisfying ending.

EDIT MODEL YOU MUST FOLLOW: ${M.p}

USER REQUEST: "${req}"
${prev?`CURRENT PLAN (change it according to the request, keep what still works): ${JSON.stringify(prev)}`:''}
FOOTAGE AND MUSIC DATA (measured from the real pixels and audio): ${JSON.stringify(info())}
${imgs.length?`Attached images: one per clip, in order (clip 0 first). Each video's image is a filmstrip of frames from left to right at filmstrip_frame_times. Use them to understand subjects, faces, action, light and mood across the whole video, and place cuts and slow motion on the best moments.`:''}
TARGET LENGTH: ${LEN?LEN+' seconds':'choose what fits the request and the footage'}.

RULES. Open on the strongest, most eye-catching shot. Vary shot lengths and match pace to the model. If music is given, time 0 is the start of the music: every cut must land on a beat (clip len = a multiple of the beat spacing), hero events and text hits must land on bass_hits or beats, and drops_at are the big moments. Never let start+len exceed a video's seconds; reuse long videos with different non-overlapping starts; never put the same clip back to back. Every photo needs a motion. The app automatically expands "groove" onto EVERY bass hit and cut, so do not list every beat: choose the groove well and list only special hero events (at most 30), texts (at most 12), sfx (at most 20) and ramps. The motion graphics are the heart of this edit, so use them boldly but with taste and variety. Sound effects are synthesized by the app. If meme_stickers exist, place them as pop-in stickers at fitting moments.

CATALOG. filters: base name (Natural, Vivid, Cinema, Noir, Faded, Warm, Cool, Vintage, Drama, Soft, Pop, Matte) with an optional tint (Rose, Amber, Teal, Violet, Lime, Sky, Crimson, Gold), for example "Cinema Teal". motion graphic event types: ${EVT.join(', ')} (punch = camera zoom hit, shake, flash, bw = black and white flash, invert, glitch, rgb = chromatic split, ring = shockwave, streak, flare, lines = speed lines, bloom, bars = letterbox, strobe, vig, zblur = zoom blur, roll, zoomhold = zoom in and hold, sub = subscribe button animation, circle = highlight circle at x,y). sfx kinds: whoosh, boom, hit, pop, riser. transitions: ${TRN.join(', ')}. clip motions: zoom_in, zoom_out, pan_left, pan_right, rise, fade_in, spin_in, pop, none. text animations: ${TK.map(k=>k[0]).join(', ')}. text styles: ${LK.join(', ')}. effects (level 0-5): ${EK.join(', ')}. blur modes: dir, zoom, spin, trail.

Reply with ONLY this JSON: {"title":str,"notes":[4 to 6 short plain sentences about your creative choices],"look":{"filter":str,"exposure":60-140,"contrast":60-140,"saturation":0-200,"warmth":-50..50,"vignette":0-100,"grain":0-100,"blur":{"on":0|1,"mode":str,"strength":0-100,"adaptive":0|1}},"reactive":{"zoom":0-0.08,"glow":0-1},"groove":{"kick":[event types, cycled on bass hits],"cut":[event types fired on every cut],"density":0-1,"intensity":0.3-2,"cut_sfx":"whoosh|hit|none","drop_fx":true|false,"zh":true|false},"events":[{"t":sec,"type":str,"dur":sec,"strength":0.3-2,"x":0-1,"y":0-1}],"sfx":[{"t":sec,"kind":str,"vol":0.3-1.2}],"progress_bar":0|1,"clips":[{"clip":int,"start":sec,"len":sec,"speed":0.25-4,"transition":str,"trans_len":0.15-1,"motion":str,"ramp":{"at":sec_into_clip,"dur":sec,"slow":0.15-0.6}|null}],"texts":[{"text":str,"at":sec,"len":sec,"anim":str,"style":str,"color":"#rrggbb","size":24-120,"y":0.1-0.9}],"stickers":[{"asset":int,"at":sec,"len":sec,"x":0-1,"y":0-1,"size":0.1-0.6,"rot":-20..20}],"music_volume":0-100}`;
const o={signal:ctl.signal,modelTier:THINK,cache:false,onText:({text})=>{$('#bs').textContent='The AI director is writing your edit… '+text.length+' characters'}};
try{return await SAMPLE.json(P,imgs.length?{...o,images:imgs}:o)}catch(e){if(imgs.length&&(e.code==='images_unavailable'||e.code==='image_rejected'))return await SAMPLE.json(P,o);throw e}}
/* ---------- flow ---------- */
const IDEAS=['Aura edit of my best moments, slow motion before the drop, title "SIGMA"','Fast viral travel reel, cut on the beat, bold title "Goa 2026"','YouTube style engaging edit, punch-in zooms, emojis, subscribe button','Cinematic 30 second trailer, teal and orange, slow zooms','Dreamy soft love video in slow motion with light leaks'];
function pills(){$('#ratio').innerHTML=['9:16','1:1','16:9'].map(r=>`<button class="pill" data-a="ratio" data-k="${r}" aria-pressed="${st.ratio===r}">${r}</button>`).join('');$('#len').innerHTML=[[0,'Auto'],[15,'15s'],[30,'30s'],[60,'60s']].map(([k,l])=>`<button class="pill" data-a="len" data-k="${k}" aria-pressed="${LEN===k}">${l}</button>`).join('');$('#ideas').innerHTML=IDEAS.map((t,i)=>`<button class="idea" data-a="idea" data-k="${i}">${esc(t)}</button>`).join('');
$('#models').innerHTML=Object.entries(MODELS).map(([k,m])=>`<button class="mdl" data-a="model" data-k="${k}" aria-pressed="${MODEL===k}"><i>${m.e}</i><div><b>${m.n}</b><span>${m.d}</span></div></button>`).join('');$('#think').innerHTML=[['quick','Fast'],['default','Balanced'],['complex','Max']].map(([k,l])=>`<button class="pill" data-a="think" data-k="${k}" aria-pressed="${THINK===k}">${l}</button>`).join('')}
const EC={punch:'#19e6c1',shake:'#ffb020',flash:'#fff',bw:'#aaa',invert:'#ccc',glitch:'#ff3d8b',rgb:'#ff3d8b',ring:'#7b5cff',streak:'#fff',flare:'#ffd23f',lines:'#9ad',bloom:'#fc8',bars:'#666',strobe:'#fff',vig:'#555',zblur:'#19e6c1',roll:'#7b5cff',zoomhold:'#19e6c1',sub:'#f03',circle:'#f03'};
function drawMap(){const c=$('#map'),x=c.getContext('2d'),w=c.width=540,h=c.height=64,q=seq(),T=q.tot||1;x.fillStyle='#1e1e2a';x.fillRect(0,0,w,h);
q.ss.forEach((s,i)=>{x.fillStyle=i%2?'#2f2f46':'#26263a';x.fillRect(s/T*w,0,q.ds[i]/T*w,h)});
if(music)music.kicks.forEach(k=>{if(k<T){x.fillStyle='#55557a';x.fillRect(k/T*w,h-8,1,8)}});
st.ev.forEach(v=>{x.fillStyle=EC[v.k]||'#fff';x.fillRect(v.t/T*w,6,Math.max(2,Math.min(v.d,1)/T*w),22)});
st.tx.forEach(t=>{x.fillStyle='#ff3d8b';x.fillRect(t.st/T*w,32,Math.max(3,t.du/T*w),8)});st.sfx.forEach(s=>{x.fillStyle='#19e6c1';x.fillRect(s.t/T*w,44,2,8)})}
function stats(){const n={};st.ev.forEach(v=>n[v.k]=(n[v.k]||0)+1);const top=Object.entries(n).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' ×'+v).join(', '),r=items.filter(o=>o.map).length;
$('#stats').textContent=`${st.ev.length} beat-synced motion graphics (${top||'none'}), ${st.sfx.length} sound effects, ${r} speed ramp${r===1?'':'s'}, ${st.tx.length} text hits, ${st.sk.length} stickers. Map above: motion graphics on top, text pink, sound effects green, bass hits grey.`}
function busyOn(t,m,ind){$('#bt').textContent=t;$('#bs').textContent=m;$('#pbar').className=ind?'ind':'';$('#pbar i').style.width=ind?'30%':'0';$('#stopb').style.display=ind?'':'none';$('#busy').className='on'}
async function create(req,prev){if(busy)return;if(!lib.length)return toast('Add some videos or photos first');if(!req)return toast('Tell the AI what edit you want');
busy=1;pause();if(!prev)lastReq=req;ctl=new AbortController();const full=req+(LEN?` Target length: ${LEN} seconds.`:'');
busyOn('Creating your edit','The AI director is looking at your footage…',1);let P=null,how='';
if(SAMPLE){try{P=await llmPlan(prev?lastReq+'\nCHANGE REQUEST: '+full:full,prev);how='Planned by the Claude Director with the '+MODELS[MODEL].n+' model. It saw your footage.'}catch(x){if(x&&x.code==='cancelled'){busy=0;$('#busy').className='';return}toast('Claude was not available, so the built-in director made this one')}}
if(!P||!Array.isArray(P.clips)||!P.clips.length){$('#bs').textContent='The built-in director is planning your edit…';P=localPlan(prev?lastReq+' '+full:full,Date.now()%100000+1);how='Planned by the built-in Smart Director with the '+MODELS[MODEL].n+' model (pixel and beat analysis)'}
$('#bs').textContent='Building the timeline and motion graphics…';await new Promise(r=>setTimeout(r,60));
try{build(P)}catch(x){toast('That plan could not be built. Try again or change the request.');busy=0;$('#busy').className='';return}
plan=P;busy=0;$('#busy').className='';$('#stage').classList.add('on');$('#out').hidden=false;$('#notes').innerHTML=(P.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('');$('#how').textContent=how;$('#ttl').textContent=P.title||'Your edit';$('#rf').value='';drawMap();stats();startPlay()}
function initAud(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();AD=AC.createMediaStreamDestination()}if(music&&!msrc){msrc=AC.createMediaElementSource(aud);msrc.connect(AD);msrc.connect(AC.destination)}}
function startPlay(){playing=1;initAud();AC.resume();if(music){aud.currentTime=Math.min(ph,(aud.duration||1e9)-.1);aud.play().catch(()=>{})}schedSfx()}
function pause(){playing=0;aud.pause();stopSfx()}
function doExport(){if(exporting||!items.length)return;const mts=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'],mt=window.MediaRecorder&&mts.find(t=>MediaRecorder.isTypeSupported(t));if(!mt)return toast('Export is not supported in this browser. Use Chrome or Safari.');
QX=4/3;size();const vs=cv.captureStream(30);initAud();AC.resume();AD.stream.getAudioTracks().forEach(t=>vs.addTrack(t));
const ch=[];rec=new MediaRecorder(vs,{mimeType:mt,videoBitsPerSecond:8e6});rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
rec.onstop=()=>{QX=1;size();$('#busy').className='';const blob=new Blob(ch,{type:mt.split(';')[0]}),ext=mt.includes('mp4')?'mp4':'webm';$('#rv').src=URL.createObjectURL(blob);$('#dlb').onclick=()=>saveF(blob,'omniacut-ai.'+ext);$('#res').className='on'};
ph=0;idx=-1;pvOk=0;exporting=1;if(music){aud.currentTime=0;aud.play().catch(()=>{})}playing=1;schedSfx();busyOn('Exporting…','Keep this tab open until it finishes.',0);rec.start()}
function finish(){exporting=0;pause();if(rec&&rec.state!=='inactive')rec.stop();ph=0}
function loop(now){const dtm=Math.min(.1,(now-last)/1000);last=now;
if(items.length){const q=seq();if(playing){ph+=dtm;if(ph>=q.tot){if(exporting)finish();else{ph=0;pause()}}}
if(ph>q.tot)ph=q.tot;render(Math.max(0,Math.min(ph,q.tot-.001)),q);
if(music)aud.volume=cp(plan&&plan.music_volume,0,100,80)/100*Math.min(1,Math.max(0,(q.tot-ph)/1.2));
$('#tm').textContent=fmt(ph);if(document.activeElement!==$('#sc'))$('#sc').value=q.tot?ph/q.tot*1000:0;$('#pp').textContent=playing?'❚❚':'▶';
if(exporting)$('#pbar i').style.width=(q.tot?ph/q.tot*100:0)+'%'}
requestAnimationFrame(loop)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k;
if(a==='pick')$('#file').click();else if(a==='music')$('#mfile').click();else if(a==='assets')$('#afile').click();
else if(a==='rm'){lib.splice(+k,1);drawLib()}else if(a==='rma'){assets.splice(+k,1);drawLib()}else if(a==='rmmus'){music=null;aud.pause();drawLib()}
else if(a==='idea')$('#pr').value=IDEAS[+k];
else if(a==='ratio'){st.ratio=k;size();pills()}else if(a==='len'){LEN=+k;pills()}else if(a==='model'){MODEL=k;pills()}else if(a==='think'){THINK=k;pills()}
else if(a==='create')create($('#pr').value.trim(),null);
else if(a==='refine'){const t=$('#rf').value.trim();if(!t)return toast('Type what you want changed');create(t,plan)}
else if(a==='reroll')create('Make a clearly different version of this edit with new shot choices, new motion graphics and a fresh look.',plan);
else if(a==='pp'){if(!items.length)return;if(playing)pause();else{if(ph>=seq().tot-.05)ph=0;startPlay()}}
else if(a==='export')doExport();else if(a==='stop'){if(ctl)ctl.abort()}else if(a==='closeres'){$('#res').className='';$('#rv').pause()}});
$('#sc').addEventListener('input',e=>{const q=seq();ph=+e.target.value/1000*q.tot;pause()});
(async()=>{try{if(window.claude&&claude.use)SAMPLE=await claude.use('sample')}catch(e){}$('#eng').textContent=SAMPLE?'🧠 Claude Director is on. It watches your footage and plans the whole edit.':'⚙️ Smart Director (built-in) is on. It analyzes your footage and your music beat.'})();
pills();drawLib();size();requestAnimationFrame(loop);
</script>
