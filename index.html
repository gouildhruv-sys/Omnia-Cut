<style>

</main>

<div id="toast"></div>

<input id="mfile" type="file" accept="audio/*" hidden>

CRAFT RULES: open on the strongest, most eye-catching shot (hook within the first second). Vary shot lengths (short bursts mixed with longer holds) and match the pace to the mood. If music is given, time 0 is the start of the music and every cut must land on a beat: make each clip length a multiple of the beat spacing. Never let start+len exceed a video's seconds. Reuse long videos with different non-overlapping start times, prefer the best_moments, and avoid back-to-back shots of the same clip. Every photo needs a motion. Use at most 3 effects and keep them tasteful. Add text only if requested or if it clearly improves the edit (short, big, legible). End on a longer calm shot. Choose a look that fits both the mood and the actual brightness and color of the footage (fix dark or flat footage).

CATALOG. filters: a base name (Natural, Vivid, Cinema, Noir, Faded, Warm, Cool, Vintage, Drama, Soft, Pop, Matte) optionally preceded by a tint (Rose, Amber, Teal, Violet, Lime, Sky, Crimson, Gold), for example "Cinema Teal". effects (level 0-5): ${EK.join(', ')}. transitions: ${TRN.join(', ')}. motions: zoom_in, zoom_out, pan_left, pan_right, rise, fade_in, spin_in, pop, none. text animations: ${TK.map(k=>k[0]).join(', ')}. text styles: ${LK.join(', ')}. blur modes: dir, zoom, spin, trail.

Reply with ONLY this JSON: {"title":str,"notes":[4 to 6 short plain sentences explaining your creative choices],"look":{"filter":str,"exposure":60-140,"contrast":60-140,"saturation":0-200,"warmth":-50..50,"vignette":0-100,"grain":0-100,"blur":{"on":0|1,"mode":str,"strength":0-100,"adaptive":0|1}},"effects":{"Glitch":2},"beauty":{"smooth":0-100,"glow":0-100,"blush":0-100},"clips":[{"clip":int,"start":seconds,"len":seconds,"speed":0.25-4,"transition":str,"trans_len":0.15-1,"motion":str}],"texts":[{"text":str,"at":seconds,"len":seconds,"anim":str,"style":str,"color":"#rrggbb","size":24-120,"y":0.1-0.9}],"music_volume":0-100}`;
const o={signal:ctl.signal,modelTier:'complex',cache:false,onText:({text})=>{$('#bs').textContent='The AI director is writing your edit… '+text.length+' characters'}};
try{return await SAMPLE.json(P,imgs.length?{...o,images:imgs}:o)}catch(e){if(imgs.length&&(e.code==='images_unavailable'||e.code==='image_rejected'))return await SAMPLE.json(P,o);throw e}}
/* ---------- flow ---------- */
const IDEAS=['Fast viral travel reel, cut on the beat, bold title "Goa 2026"','Cinematic 30 second trailer, teal and orange, slow zooms','Dreamy soft love video in slow motion with sparkles','Neon night party edit with glitch and flash','Retro VHS memories, warm and grainy'];
function pills(){$('#ratio').innerHTML=['9:16','1:1','16:9'].map(r=>`<button class="pill" data-a="ratio" data-k="${r}" aria-pressed="${st.ratio===r}">${r}</button>`).join('');$('#len').innerHTML=[[0,'Auto'],[15,'15s'],[30,'30s'],[60,'60s']].map(([k,l])=>`<button class="pill" data-a="len" data-k="${k}" aria-pressed="${LEN===k}">${l}</button>`).join('');$('#ideas').innerHTML=IDEAS.map((t,i)=>`<button class="idea" data-a="idea" data-k="${i}">${esc(t)}</button>`).join('')}
function busyOn(t,m,ind){$('#bt').textContent=t;$('#bs').textContent=m;$('#pbar').className=ind?'ind':'';$('#pbar i').style.width=ind?'30%':'0';$('#stopb').style.display=ind?'':'none';$('#busy').className='on'}
async function create(req,prev){if(busy)return;if(!lib.length)return toast('Add some videos or photos first');if(!req)return toast('Tell the AI what edit you want');
busy=1;playing=0;aud.pause();if(!prev)lastReq=req;ctl=new AbortController();const full=req+(LEN?` Target length: ${LEN} seconds.`:'');
busyOn('Creating your edit','The AI director is looking at your footage…',1);let P=null,how='';
if(SAMPLE){try{P=await llmPlan(prev?lastReq+'\nCHANGE REQUEST: '+full:full,prev);how='Planned by the Claude Director, which saw your footage'}catch(x){if(x&&x.code==='cancelled'){busy=0;$('#busy').className='';return}toast('Claude was not available, so the built-in director made this one')}}
if(!P||!Array.isArray(P.clips)||!P.clips.length){$('#bs').textContent='The built-in director is planning your edit…';P=localPlan(prev?lastReq+' '+full:full,Date.now()%100000+1);how='Planned by the built-in Smart Director (footage and beat analysis)'}
$('#bs').textContent='Building the timeline…';await new Promise(r=>setTimeout(r,60));
try{build(P)}catch(x){toast('That plan could not be built. Try again or change the request.');busy=0;$('#busy').className='';return}
plan=P;busy=0;$('#busy').className='';$('#stage').classList.add('on');$('#out').hidden=false;$('#notes').innerHTML=(P.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('');$('#how').textContent=how;$('#ttl').textContent=P.title||'Your edit';$('#rf').value='';startPlay()}
function startPlay(){playing=1;if(music){initAud();AC.resume();aud.currentTime=Math.min(ph,(aud.duration||1e9)-.1);aud.play().catch(()=>{})}}
function initAud(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();const s=AC.createMediaElementSource(aud);AD=AC.createMediaStreamDestination();s.connect(AD);s.connect(AC.destination)}
function doExport(){if(exporting||!items.length)return;const mts=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'],mt=window.MediaRecorder&&mts.find(t=>MediaRecorder.isTypeSupported(t));if(!mt)return toast('Export is not supported in this browser. Use Chrome or Safari.');
QX=4/3;size();const vs=cv.captureStream(30);if(music){initAud();AC.resume();AD.stream.getAudioTracks().forEach(t=>vs.addTrack(t))}
const ch=[];rec=new MediaRecorder(vs,{mimeType:mt,videoBitsPerSecond:8e6});rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
rec.onstop=()=>{QX=1;size();$('#busy').className='';const blob=new Blob(ch,{type:mt.split(';')[0]}),ext=mt.includes('mp4')?'mp4':'webm';$('#rv').src=URL.createObjectURL(blob);$('#dlb').onclick=()=>saveF(blob,'omniacut-ai.'+ext);$('#res').className='on'};
ph=0;idx=-1;pvOk=0;exporting=1;if(music){aud.currentTime=0;aud.play().catch(()=>{})}playing=1;busyOn('Exporting…','Keep this tab open until it finishes.',0);rec.start()}
function finish(){exporting=0;playing=0;aud.pause();if(rec&&rec.state!=='inactive')rec.stop();ph=0}
function loop(now){const dtm=Math.min(.1,(now-last)/1000);last=now;
if(items.length){const q=seq();if(playing){ph+=dtm;if(ph>=q.tot){if(exporting)finish();else{ph=0;playing=0;aud.pause()}}}
if(ph>q.tot)ph=q.tot;render(Math.max(0,Math.min(ph,q.tot-.001)),q);
if(music)aud.volume=cp(plan&&plan.music_volume,0,100,80)/100*Math.min(1,Math.max(0,(q.tot-ph)/1.2));
$('#tm').textContent=fmt(ph);if(document.activeElement!==$('#sc'))$('#sc').value=q.tot?ph/q.tot*1000:0;$('#pp').textContent=playing?'❚❚':'▶';
if(exporting)$('#pbar i').style.width=(q.tot?ph/q.tot*100:0)+'%'}
requestAnimationFrame(loop)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k;
if(a==='pick')$('#file').click();else if(a==='music')$('#mfile').click();
else if(a==='rm'){lib.splice(+k,1);drawLib()}else if(a==='rmmus'){music=null;aud.pause();drawLib()}
else if(a==='idea')$('#pr').value=IDEAS[+k];
else if(a==='ratio'){st.ratio=k;size();pills()}else if(a==='len'){LEN=+k;pills()}
else if(a==='create')create($('#pr').value.trim(),null);
else if(a==='refine'){const t=$('#rf').value.trim();if(!t)return toast('Type what you want changed');create(t,plan)}
else if(a==='reroll')create('Make a clearly different version of this edit with new shot choices, new motion and a fresh look.',plan);
else if(a==='pp'){if(!items.length)return;if(playing){playing=0;aud.pause()}else{if(ph>=seq().tot-.05)ph=0;startPlay()}}
else if(a==='export')doExport();else if(a==='stop'){if(ctl)ctl.abort()}else if(a==='closeres'){$('#res').className='on';$('#res').className='';$('#rv').pause()}});
$('#sc').addEventListener('input',e=>{const q=seq();ph=+e.target.value/1000*q.tot;playing=0;aud.pause()});
(async()=>{try{if(window.claude&&claude.use)SAMPLE=await claude.use('sample')}catch(e){}$('#eng').textContent=SAMPLE?'🧠 Claude Director is on. It watches your footage and plans the whole edit.':'⚙️ Smart Director (built-in) is on. It analyzes your footage and your music beat.'})();
pills();drawLib();size();requestAnimationFrame(loop);

</script>
